services:
  - type: web
    name: forgeai
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # live runs and chat on Groq (Render has no GPU for Ollama). Set "1" to go back to browse-only.
      - key: FORGE_READONLY
        value: "0"
      - key: FORGE_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false   # paste it in the Render dashboard; never commit it
