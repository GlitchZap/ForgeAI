services:
  - type: web
    name: forgeai
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: FORGE_READONLY
        value: "1"
      - key: OLLAMA_HOST
        sync: false
      - key: FORGE_MODEL
        value: qwen2.5:7b
      - key: FORGE_JUDGE_MODEL
        value: llama3.1:8b
      - key: FORGE_EMBED_MODEL
        value: nomic-embed-text
